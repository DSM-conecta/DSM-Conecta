version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb-dsm
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto-dsm
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

volumes:
  mongo_data: